# candemkey.com statik site güvenlik başlıkları (location bloklarına include edilir; nginx, location'da
# add_header varsa sunucu düzeyindekileri miras almaz, bu yüzden her ilgili bloğa ayrıca eklenir).
# CSP: sitede harici kaynak yok. Satır içi betikler yalnızca SHA-256 özetleriyle izinli; bir satır içi
# betik değişirse yeni özeti buraya ekleyin (aksi hâlde tarayıcı o betiği çalıştırmaz).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-lnMTjeU8s5OeyhMC4cKKCOxx/fgaAkcNhxSsOoQY3tY=' 'sha256-GUd058UYc5VA/aXUtuIkvCSQ5/Wgk2L4EXZ+0isssJY=' 'sha256-HyAz1pnrfGC61icxDikxrExnCjHkNl8j/KzBTsz5ydI='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
#
# Sunucudaki yeri: /etc/nginx/snippets/candemkey-site-headers.conf; candemkey.com server bloğunda
# `location /`, `location ~* \.html$`, statik varlık ve 404 bloklarına `include` edilir.
# Satır içi bir <script> (kök index.html'deki dil yönlendirmesi ya da ana sayfalardaki 'js' sınıfı betiği)
# değişirse yeni özet şu komutla hesaplanır ve script-src'ye eklenir:
#   python3 -c "import re,hashlib,base64,sys;s=open(sys.argv[1]).read();[print(base64.b64encode(hashlib.sha256(m.encode()).digest()).decode()) for m in re.findall(r'<script>(.*?)</script>',s,re.S)]" index.html
